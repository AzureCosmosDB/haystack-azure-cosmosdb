name: License Compliance

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - ".github/workflows/license_compliance.yml"
  # PRs are covered above; run a daily cron to catch newly-flagged transitive licenses.
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  license-check:
    name: Direct dependencies
    runs-on: ubuntu-latest
    env:
      REQUIREMENTS_FILE: requirements_direct.txt
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Extract direct dependencies from pyproject.toml
        run: |
          python -m pip install --upgrade pip
          pip install toml
          python .github/utils/pyproject_to_requirements.py pyproject.toml > "${{ env.REQUIREMENTS_FILE }}"
          echo "Direct dependencies to check:"
          cat "${{ env.REQUIREMENTS_FILE }}"

      - name: Check licenses
        id: license_check_report
        uses: pilosus/action-pip-license-checker@e909b0226ff49d3235c99c4585bc617f49fff16a # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          requirements: ${{ env.REQUIREMENTS_FILE }}
          fail: "Copyleft,Other,Error"
          # Exclusions must be explicitly motivated:
          # - azure-identity is MIT but the license is not published on PyPI, so the checker errors.
          exclude: "(?i)^(azure-identity).*"

      - name: Print report
        if: ${{ always() }}
        run: echo "${{ steps.license_check_report.outputs.report }}"
