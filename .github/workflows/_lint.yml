name: lint

on:
  workflow_call:

permissions:
  contents: read

env:
  # Inline annotations on PR diffs when ruff complains.
  RUFF_OUTPUT_FORMAT: github

jobs:
  lint:
    name: "lint & type-check #${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Min + max supported Pythons only; intermediates almost never surface
        # a lint/type issue that doesn't show up on the boundaries.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with lint extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[lint]"

      - name: ruff check
        run: ruff check src tests

      - name: black --check
        run: black --check src tests

      - name: mypy
        run: mypy src/haystack_azure_cosmosdb
