name: lint

on:
  workflow_call:

permissions:
  contents: read

env:
  # Inline annotations on PR diffs when ruff complains.
  RUFF_OUTPUT_FORMAT: github

jobs:
  lint:
    name: "lint & type-check #${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Min + max supported Pythons only; intermediates almost never surface
        # a lint/type issue that doesn't show up on the boundaries.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with lint extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[lint]"

      - name: ruff check
        run: ruff check src tests

      - name: black --check
        run: black --check src tests

      - name: mypy
        run: mypy src/haystack_azure_cosmosdb
