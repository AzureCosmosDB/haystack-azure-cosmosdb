name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same PR / branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/_lint.yml
    permissions:
      contents: read

  test:
    uses: ./.github/workflows/_test.yml
    permissions:
      contents: read

  ci-success:
    # Single required-status-check target. Configure branch protection to
    # require ONLY this job ("CI Success"); it summarizes the lint + test
    # matrices so a failure in any matrix cell blocks merge, while additions
    # to those matrices never require updating branch-protection settings.
    name: "CI Success"
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-latest
    env:
      RESULTS_JSON: ${{ toJSON(needs.*.result) }}
      EXIT_CODE: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && '0' || '1' }}
    steps:
      - name: Aggregate results
        run: |
          echo "lint result: ${{ needs.lint.result }}"
          echo "test result: ${{ needs.test.result }}"
          echo "all results: $RESULTS_JSON"
          echo "Exiting with $EXIT_CODE"
          exit "$EXIT_CODE"
